<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add transaction</title>
<style>
  :root{--bg:#0f1720;--card:#17212d;--line:#2a3849;--text:#e9eef4;--mute:#8fa1b5;--accent:#f0b64a;--ok:#5ad19a;--err:#ff7b7b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px}
  main{width:100%;max-width:460px}
  h1{font-size:1.25rem;margin:8px 0 16px}
  form,#login{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
  label{display:grid;gap:6px;color:var(--mute);font-size:.85rem}
  input,select,textarea,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .types button{display:grid;place-items:center;padding:12px 0;cursor:pointer}
  .types button svg{width:26px;height:26px;stroke:var(--mute);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .types button[aria-pressed=true]{border-color:var(--accent);background:#2a2415}
  .types button[aria-pressed=true] svg{stroke:var(--accent)}
  #typeName{text-align:center;font-size:.9rem;color:var(--accent);margin-top:-6px}
  .check{display:flex;align-items:center;gap:10px;color:var(--text);font-size:1rem}
  .check input{width:20px;height:20px;accent-color:var(--accent)}
  .save{background:var(--accent);color:#1b1405;font-weight:700;border:0;cursor:pointer}
  .save:disabled{opacity:.6}
  #msg{min-height:1.2em;font-size:.9rem;text-align:center}
  #logout{background:none;border:0;color:var(--mute);width:auto;padding:4px;font-size:.8rem;cursor:pointer;justify-self:end}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Add transaction</h1>

  <form id="form">
    <div class="types" id="types" role="group" aria-label="Type"></div>
    <div id="typeName"></div>

    <div class="row">
      <label>Date<input id="date" type="date" required></label>
      <label>Amount<input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></label>
    </div>

    <div class="row">
      <label>From<select id="from"></select></label>
      <label>To<select id="to"></select></label>
    </div>

    <label>Category<select id="cata"></select></label>

    <label>Remarks<textarea id="remarks" rows="2"></textarea></label>

    <label class="check"><input id="plan" type="checkbox"> Plan</label>

    <button class="save" id="saveBtn" type="submit">Save transaction</button>
    <div id="msg" role="status"></div>
  </form>
</main>

<script>
// 1) Paste your values from Supabase: Project Settings > API
const SUPABASE_URL = "https://nfczmefycwbhjxweleif.supabase.co";
const SUPABASE_KEY = "sb_publishable_qcUEnm2TbUwPLc-Wa1NP6w_d3VFBrnp";

const BASE = SUPABASE_URL.trim().replace(/\/+$/, "") + "/rest/v1/";
const HEAD = { apikey: SUPABASE_KEY.trim(), "Content-Type": "application/json" };
async function get(table) {
  try {
    const r = await fetch(BASE + table + "?select=*&order=id", { headers: HEAD });
    const j = await r.json();
    if (!r.ok) return { error: { message: j.message || "HTTP " + r.status } };
    return { data: j };
  } catch (e) { return { error: { message: e.message } }; }
}
async function add(row) {
  try {
    const r = await fetch(BASE + "transaction", { method: "POST", headers: { ...HEAD, Prefer: "return=minimal" }, body: JSON.stringify(row) });
    if (!r.ok) { const j = await r.json(); return { error: { message: j.message || "HTTP " + r.status } }; }
    return {};
  } catch (e) { return { error: { message: e.message } }; }
}
const $ = id => document.getElementById(id);
let typeId = null;

// Icons by type name (keeps only 4 types, icon only)
const ICONS = {
  "income":'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  "expense":'<path d="M12 20V9M7 13l5-5 5 5M5 4h14"/>',
  "transfer":'<path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/>',
  "other income":'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>'
};

const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const say = (t, ok) => { $("msg").textContent = t; $("msg").style.color = ok ? "var(--ok)" : "var(--err)"; };

function fillSelect(el, rows, key, blank) {
  el.innerHTML = `<option value="">${blank}</option>` +
    rows.map(r => `<option value="${r.id}">${r[key]}</option>`).join("");
}

let TYPES = [];
function bankId() {
  const o = [...$("from").options].find(o => o.text.trim().toLowerCase() === "bank");
  return o ? o.value : "";
}
function pickType(id) {
  typeId = id;
  document.querySelectorAll("#types button").forEach(b =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.id) === id)));
  const name = (TYPES.find(r => r.id === id) || {})["type name"] || "";
  $("typeName").textContent = name;
  const k = name.toLowerCase(), b = bankId();
  if (k === "expense") { $("from").value = ""; $("to").value = b; }
  else if (k === "income" || k === "other income") { $("from").value = b; $("to").value = ""; }
  else if (k === "transfer") { $("from").value = b; $("to").value = b; }
}

async function loadLists() {
  const [t, a, c] = await Promise.all([
    get("type"),
    get("accounts"),
    get("cata")
  ]);
  if (t.error || a.error || c.error) { say("Error: " + (t.error || a.error || c.error).message, false); return; }

  TYPES = t.data;
  $("types").innerHTML = t.data.map(r => {
    const name = r["type name"];
    const icon = ICONS[name.toLowerCase()] || '<circle cx="12" cy="12" r="3"/>';
    return `<button type="button" data-id="${r.id}" aria-pressed="false" aria-label="${name}" title="${name}">
      <svg viewBox="0 0 24 24">${icon}</svg></button>`;
  }).join("");
  document.querySelectorAll("#types button").forEach(b =>
    b.onclick = () => pickType(Number(b.dataset.id)));

  fillSelect($("from"), a.data, "account name", "From");
  fillSelect($("to"), a.data, "account name", "To");
  fillSelect($("cata"), c.data, "cata name", "Category");
  const d = t.data.find(r => r["type name"].toLowerCase() === "expense") || t.data[0];
  if (d) pickType(d.id);
}

async function showApp() {
  $("date").value = today();
  await loadLists();
}

async function init() { await showApp(); }

$("form").onsubmit = async e => {
  e.preventDefault();
  if (!typeId) { say("Choose a type.", false); return; }
  $("saveBtn").disabled = true;
  const row = {
    date: $("date").value,
    amount: Number($("amount").value),
    cata: $("cata").value || null,
    type: typeId,
    remarks: $("remarks").value.trim() || null,
    from: $("from").value || null,
    to: $("to").value || null,
    plan: $("plan").checked
  };
  const { error } = await add(row);
  $("saveBtn").disabled = false;
  if (error) { say(error.message, false); return; }
  say("Saved", true);
  $("amount").value = ""; $("remarks").value = ""; $("plan").checked = false;
  $("amount").focus();
};

init();
</script>
</body>
</html>
