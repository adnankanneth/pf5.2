<style>

  *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

  .nav{--n:2;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;grid-template-columns:repeat(2,64px);gap:0;padding:4px;border-radius:26px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(16,24,40,.18);z-index:10;touch-action:pan-y;user-select:none;-webkit-user-select:none}

  input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.is-plan{border:1.5px dashed #f59e0b;background:color-mix(in srgb,#f59e0b 6%,var(--card))}.is-plan .check{background:color-mix(in srgb,#f59e0b 14%,var(--field))}.is-plan .check input:checked{background:#f59e0b;border-color:#f59e0b}.is-plan .save{background:#f59e0b;color:#1b1405}
  .seg{--n:4;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--field);padding:4px;border-radius:16px;touch-action:pan-y;user-select:none;-webkit-user-select:none}.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:12px;background:var(--card);box-shadow:0 1px 4px rgba(16,24,40,.14);transition:transform .25s cubic-bezier(.3,.9,.3,1);pointer-events:none}.seg button{position:relative;z-index:1;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:11px 0;color:var(--mute);font:inherit}.seg button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.seg button[aria-pressed=true]{color:var(--accent)}.seg.sq{border-radius:10px}.seg.sq .thumb{border-radius:7px}.seg.sq button{padding:9px 0;font-size:.85rem;font-weight:650}.seg.sq button[aria-pressed=true]{color:var(--text)}

  #pgDash .card,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-top:12px}.bal{padding:18px 16px 14px;text-align:center}.bal .lbl{font-size:.78rem;color:var(--mute);font-weight:550}.bal .big{font-size:2.2rem;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}.split{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:12px}.split div{display:grid;gap:2px;font-size:.72rem;color:var(--mute);font-weight:550}.split div+div{border-left:1px solid var(--line)}.split b{font-size:.95rem;color:var(--text);font-weight:650}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.three .card{margin-top:12px;padding:12px 6px;text-align:center;font-size:.72rem;color:var(--mute);font-weight:550;display:grid;gap:2px}.three b{font-size:1rem;font-weight:650}.inc,.pos{color:var(--ok)}.exp,.neg{color:var(--err)}.trf{color:#3b82f6}

  .lh{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;font-size:.95rem}.lh span{color:var(--mute);font-size:.78rem;align-self:center}.swipe-row{position:relative;overflow:hidden;border-top:1px solid var(--line);background:var(--err)}.swipe-row:first-child{border-top:0}.swipe-action{position:absolute;top:0;bottom:0;width:88px;border:0;color:#fff;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}.swipe-action.plan-action{left:0;background:#f59e0b;color:#1b1405}.swipe-action.delete-action{right:0;background:var(--err)}.item{position:relative;display:flex;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--card);transition:transform .16s ease;touch-action:pan-y;cursor:pointer}.item .l{min-width:0;display:grid;gap:2px}.item .t{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .s{font-size:.75rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .a{font-weight:650;white-space:nowrap}.tag{font-size:.65rem;font-weight:700;color:#1b1405;background:#f59e0b;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}.empty{padding:16px;text-align:center;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="pages" id="pages">
  <section class="page active" id="pgAdd"><main><h1 id="formTitle">Add</h1><form id="form"><div class="seg" id="types" role="group" aria-label="Type"></div><div id="typeName"></div><label class="amount">Amount<input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></label><div class="row"><label>Date<input id="date" type="date" required></label><label>Category<select id="cata"></select></label></div><div class="row"><label>From<select id="from"></select></label><label>To<select id="to"></select></label></div><label>Remarks<textarea id="remarks" rows="2" placeholder="Add a note"></textarea></label><label class="check">Plan<input id="plan" type="checkbox"></label><button class="save" id="saveBtn" type="submit">Save transaction</button><button class="cancel" id="cancelEdit" type="button" hidden>Cancel edit</button><div id="msg" role="status"></div></form></main></section>
  <section class="page" id="pgDash"><main><h1>Dashboard</h1><div class="seg sq" id="modeSeg"><i class="thumb"></i><button type="button">Real</button><button type="button">Plan</button><button type="button">Real+Plan</button></div><div class="card bal"><div class="lbl" id="balLbl">Balance</div><div class="big" id="balance">0</div><div class="split"><div>Bank<b id="bBank">0</b></div><div>Cash<b id="bCash">0</b></div></div></div><div class="three"><div class="card">In<b class="inc" id="cIn">0</b></div><div class="card">Out<b class="exp" id="cOut">0</b></div><div class="card">Net<b id="cNet">0</b></div></div><div class="card"><div class="chead"><div class="t" id="calNav"><button class="ib" id="prevM" type="button" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span id="calTitle"></span><button class="ib" id="nextM" type="button" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div><div class="vsw"><button class="ib on" id="vCal" type="button" aria-label="Calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button><button class="ib" id="vGraph" type="button" aria-label="Graph"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></button></div></div><div id="calWrap"><div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div id="calGrid"></div></div><div id="graphBox">Graph coming soon</div></div><div class="card"><div class="lh"><b>Transactions</b><span id="listRange"></span></div><div id="recent"></div></div></main></section>
</div>
<nav class="nav" id="pageNav" aria-label="Pages"><i class="thumb"></i><button type="button" data-p="0" aria-label="Add" aria-current="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" data-p="1" aria-label="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></button></nav>
<script src="config.js"></script>
<script>
if(typeof SUPABASE_URL==="undefined"||typeof SUPABASE_KEY==="undefined"){const m=document.getElementById("msg");m.textContent="config.js not found. Upload config.js next to index.html.";m.style.color="var(--err)";throw new Error("config.js missing");}
let BASE=SUPABASE_URL.trim().replace(/\/+$/,"");if(!BASE.includes("/rest/v1"))BASE+="/rest/v1";BASE+="/";const HEAD={apikey:SUPABASE_KEY.trim(),"Content-Type":"application/json"};
async function getq(path){try{const r=await fetch(BASE+path,{headers:HEAD}),j=await r.json();if(!r.ok)return{error:{message:j.message||"HTTP "+r.status}};return{data:j};}catch(e){return{error:{message:e.message}};}}
const get=table=>getq(table+"?select=*&order=id");async function fetchAll(){let out=[],off=0;for(;;){const r=await getq(`transaction?select=*&order=date.desc,id.desc&limit=1000&offset=${off}`);if(r.error)return r;out=out.concat(r.data);if(r.data.length<1000)break;off+=1000;}return{data:out};}
async function request(method,path,row){try{const r=await fetch(BASE+path,{method,headers:{...HEAD,Prefer:"return=minimal"},...(row?{body:JSON.stringify(row)}:{})});if(!r.ok){const j=await r.json();return{error:{message:j.message||"HTTP "+r.status}};}return{};}catch(e){return{error:{message:e.message}};}}
const add=row=>request("POST","transaction",row),updateTransaction=(id,row)=>request("PATCH",`transaction?id=eq.${encodeURIComponent(id)}`,row),setTransactionPlan=(id,plan)=>request("PATCH",`transaction?id=eq.${encodeURIComponent(id)}`,{plan}),deleteTransaction=id=>request("DELETE",`transaction?id=eq.${encodeURIComponent(id)}`);
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),money=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:2}),today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),iso=(y,m,d)=>new Date(Date.UTC(y,m,d)).toISOString().slice(0,10),say=(t,ok)=>{$("msg").textContent=t;$("msg").style.color=ok?"var(--ok)":"var(--err)";};
function makeSeg(el,onPick){const th=el.querySelector(".thumb"),bs=[...el.querySelectorAll("button")],n=bs.length;el.style.setProperty("--n",n);let idx=0,down=false,drag=false,sx=0;const mark=()=>bs.forEach((b,j)=>b.setAttribute("aria-pressed",String(j===idx)));const at=x=>{const r=el.getBoundingClientRect();return Math.max(0,Math.min(n-1,Math.floor((x-r.left-4)/((r.width-8)/n))));};const snap=()=>{th.style.transition="";th.style.transform=`translateX(${idx*100}%)`;};const set=i=>{idx=i;mark();if(!drag)snap();};el.addEventListener("pointerdown",e=>{down=true;drag=false;sx=e.clientX;el.setPointerCapture(e.pointerId);});el.addEventListener("pointermove",e=>{if(!down)return;if(!drag&&Math.abs(e.clientX-sx)>6){drag=true;th.style.transition="none";}if(!drag)return;const r=el.getBoundingClientRect(),W=r.width-8,tw=W/n,x=Math.max(0,Math.min(W-tw,e.clientX-r.left-4-tw/2));th.style.transform=`translateX(${x}px)`;const i=at(e.clientX);if(i!==idx){idx=i;mark();onPick(i);}});const end=e=>{if(!down)return;down=false;if(!drag){const i=at(e.clientX);idx=i;mark();onPick(i);}drag=false;snap();};el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);bs.forEach((b,j)=>b.addEventListener("click",e=>{if(e.detail===0){idx=j;mark();snap();onPick(j);}}));set(0);return{set};}
let page=0,typeColor="#e5484d",navSeg=null;function applyAccent(){document.documentElement.style.setProperty("--accent",page===0?typeColor:"#6366f1");}function go(p,syncNav=true){page=p;document.querySelectorAll(".page").forEach((pg,i)=>pg.classList.toggle("active",i===p));document.querySelectorAll("#pageNav button").forEach(b=>b.setAttribute("aria-current",String(Number(b.dataset.p)===p)));applyAccent();if(syncNav&&navSeg)navSeg.set(p);if(p===1)renderDash();}navSeg=makeSeg($("pageNav"),p=>go(p,false));
let typeId=null,typeSeg=null,editId=null;const ICONS={income:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',expense:'<path d="M12 20V9M7 13l5-5 5 5M5 4h14"/>',transfer:'<path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/>','other income':'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>'};function fillSelect(el,rows,key,blank){el.innerHTML=`<option value="">${blank}</option>`+rows.map(r=>`<option value="${r.id}">${esc(r[key])}</option>`).join("");}let TYPES=[],CATS=[],ACCS=[];
function bankId(){const o=[...$("from").options].find(o=>o.text.trim().toLowerCase()==="bank");return o?o.value:"";}function pickType(id){typeId=id;const i=TYPES.findIndex(r=>String(r.id)===String(id));if(typeSeg&&i>=0)typeSeg.set(i);const name=(TYPES[i]||{})["type name"]||"";$("typeName").textContent=name;const COL={expense:"#e5484d",income:"#12a36b","other income":"#0ea5a4",transfer:"#3b82f6"};typeColor=COL[name.toLowerCase()]||"#6366f1";applyAccent();const k=name.toLowerCase(),b=bankId();if(k==="expense"){$("from").value="";$("to").value=b;}else if(k==="income"||k==="other income"){$("from").value=b;$("to").value="";}else if(k==="transfer"){$("from").value=b;$("to").value=b;}}
async function loadLists(){const[t,a,c]=await Promise.all([get("type"),get("accounts"),get("cata")]);if(t.error||a.error||c.error){say("Error: "+(t.error||a.error||c.error).message,false);return false;}TYPES=t.data;ACCS=a.data;CATS=c.data;$("types").innerHTML='<i class="thumb"></i>'+t.data.map(r=>`<button type="button" data-id="${r.id}" aria-pressed="false" aria-label="${esc(r["type name"])}" title="${esc(r["type name"])}">${esc(r["type name"])}</button>`).join("");typeSeg=makeSeg($("types"),i=>pickType(TYPES[i].id));fillSelect($("from"),a.data,"account name","From");fillSelect($("to"),a.data,"account name","To");fillSelect($("cata"),c.data,"cata name","Category");const d=t.data.find(r=>r["type name"].toLowerCase()==="expense")||t.data[0];if(d)pickType(d.id);return true;}
function clearForm(date=today(),plan=false){editId=null;$("form").reset();const d=TYPES.find(r=>r["type name"].toLowerCase()==="expense")||TYPES[0];if(d)pickType(d.id);$("date").value=date;$("plan").checked=plan;$("formTitle").textContent="Add";$("cancelEdit").hidden=true;$("saveBtn").textContent=plan?"Save as plan":"Save transaction";$("msg").textContent="";updatePlan();}function editTransaction(t){editId=t.id;$("form").reset();pickType(t.type);$("amount").value=t.amount;$("date").value=t.date;$("cata").value=t.cata??"";$("from").value=t.from??"";$("to").value=t.to??"";$("remarks").value=t.remarks??"";$("plan").checked=!!t.plan;$("formTitle").textContent="Edit transaction";$("saveBtn").textContent="Update transaction";$("cancelEdit").hidden=false;$("msg").textContent="";updatePlan();go(0);$("amount").focus();}$("cancelEdit").onclick=()=>clearForm();

let ALL=[],ERR="",mode=0,sel=null,calView="cal";const now0=new Date();let dY=now0.getFullYear(),dM=now0.getMonth();const nameOf=(list,key,id)=>(list.find(r=>String(r.id)===String(id))||{})[key]||"",kind=id=>nameOf(TYPES,"type name",id).toLowerCase(),accKey=id=>{const n=nameOf(ACCS,"account name",id).trim().toLowerCase();return n==="bank"||n==="cash"?n:null;};
