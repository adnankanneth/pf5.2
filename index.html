<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transactions</title>
<style>
  :root{--bg:#f3f5f9;--card:#fff;--line:#e3e8ef;--text:#111827;--mute:#6b7280;--field:#f6f7fb;--accent:#e5484d;--ok:#12a36b;--err:#e5484d;--shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(16,24,40,.07)}
  @media (prefers-color-scheme:dark){:root{--bg:#0c0f14;--card:#151a22;--line:#242c38;--text:#eef1f6;--mute:#8b96a8;--field:#1b222c;--ok:#3ed598;--err:#ff6b70;--shadow:0 10px 30px rgba(0,0,0,.35)}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

  /* Pages + slide */
  .pages{position:fixed;inset:0;overflow:hidden}
  .track{display:flex;width:200%;height:100%;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  .page{width:50%;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:20px 16px calc(110px + env(safe-area-inset-bottom));touch-action:pan-y}
  .page>main{width:100%;max-width:440px;margin:0 auto}
  h1{font-size:1.15rem;font-weight:650;margin:6px 4px 16px;letter-spacing:-.01em}

  /* Nav */
  .nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(16,24,40,.18);z-index:10}
  .nav button{width:64px;height:46px;border:0;border-radius:20px;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
  .nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nav button[aria-current=true]{background:var(--field);color:var(--accent)}

  /* Form */
  form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:16px;box-shadow:var(--shadow)}
  label{display:grid;gap:6px;color:var(--mute);font-size:.78rem;font-weight:550}
  input,select,textarea{font:inherit;font-size:1rem;color:var(--text);background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;width:100%;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b96a8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
  textarea{resize:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #typeName{text-align:center;font-size:.85rem;font-weight:650;color:var(--accent);margin-top:-6px}
  .amount{text-align:center}
  .amount input{background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;font-size:2.4rem;font-weight:650;text-align:center;padding:6px 0;letter-spacing:-.02em;box-shadow:none}
  .amount input:focus{border-color:var(--accent);box-shadow:none}
  .amount input::placeholder{color:var(--line)}
  .check{display:flex;align-items:center;justify-content:space-between;background:var(--field);border-radius:12px;padding:12px 14px;color:var(--text);font-size:1rem;font-weight:500}
  .check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;padding:0;border-radius:8px;border:2px solid var(--mute);background:transparent;position:relative;cursor:pointer;flex:none}
  .check input:checked{background:var(--accent);border-color:var(--accent)}
  .check input:checked::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .save{border:0;border-radius:14px;padding:15px;font:inherit;font-size:1rem;font-weight:650;color:#fff;background:var(--accent);cursor:pointer;width:100%;transition:transform .1s,opacity .15s}
  .save:active{transform:scale(.98)}
  .save:disabled{opacity:.6}
  .save:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
  #msg{min-height:1.2em;font-size:.9rem;text-align:center;font-weight:550}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .is-plan{border:1.5px dashed #f59e0b;background:color-mix(in srgb,#f59e0b 6%,var(--card))}
  .is-plan .check{background:color-mix(in srgb,#f59e0b 14%,var(--field))}
  .is-plan .check input:checked{background:#f59e0b;border-color:#f59e0b}
  .is-plan .save{background:#f59e0b;color:#1b1405}

  /* Sliding segmented control (iPhone style) */
  .seg{--n:4;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--field);padding:4px;border-radius:16px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:12px;background:var(--card);box-shadow:0 1px 4px rgba(16,24,40,.14);transition:transform .25s cubic-bezier(.3,.9,.3,1);pointer-events:none}
  .seg button{position:relative;z-index:1;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:11px 0;color:var(--mute);font:inherit}
  .seg button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .seg button[aria-pressed=true]{color:var(--accent)}
  .seg.sq{border-radius:10px}
  .seg.sq .thumb{border-radius:7px}
  .seg.sq button{padding:9px 0;font-size:.85rem;font-weight:650}
  .seg.sq button[aria-pressed=true]{color:var(--text)}

  /* Dashboard */
  #pgDash .card,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-top:12px}
  .bal{padding:18px 16px 14px;text-align:center}
  .bal .lbl{font-size:.78rem;color:var(--mute);font-weight:550}
  .bal .big{font-size:2.2rem;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
  .split{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:12px}
  .split div{display:grid;gap:2px;font-size:.72rem;color:var(--mute);font-weight:550}
  .split div+div{border-left:1px solid var(--line)}
  .split b{font-size:.95rem;color:var(--text);font-weight:650}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .three .card{margin-top:12px;padding:12px 6px;text-align:center;font-size:.72rem;color:var(--mute);font-weight:550;display:grid;gap:2px}
  .three b{font-size:1rem;font-weight:650}
  .inc,.pos{color:var(--ok)} .exp,.neg{color:var(--err)} .trf{color:#3b82f6}
  .chead{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 2px 14px}
  .chead .t{font-weight:650;font-size:.95rem;display:flex;align-items:center;gap:2px}
  .chead .t span{min-width:118px;text-align:center}
  .ib{border:0;background:transparent;color:var(--mute);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
  .ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ib.on{background:var(--field);color:var(--accent)}
  .vsw{display:flex;gap:2px}
  #calWrap{padding:6px 10px 12px;touch-action:none;user-select:none;-webkit-user-select:none}
  .dow,#calGrid{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow span{text-align:center;font-size:.68rem;color:var(--mute);font-weight:600;padding:4px 0}
  .day{height:50px;display:grid;align-content:center;justify-items:center;gap:1px;font-size:.85rem;border-radius:10px}
  .day small{font-size:.62rem;font-weight:650;min-height:.8em}
  .day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .day.in{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .day.edge{background:var(--accent);color:#fff}
  .day.edge small{color:#fff}
  #graphBox{display:none;padding:50px 16px;text-align:center;color:var(--mute);font-weight:600}
  .lh{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;font-size:.95rem}
  .lh span{color:var(--mute);font-size:.78rem;align-self:center}
  .item{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
  .item .l{min-width:0;display:grid;gap:2px}
  .item .t{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .s{font-size:.75rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .a{font-weight:650;white-space:nowrap}
  .tag{font-size:.65rem;font-weight:700;color:#1b1405;background:#f59e0b;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}
  .empty{padding:16px;text-align:center;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>
<body>

<div class="pages" id="pages">
 <div class="track" id="track">

  <!-- ADD PAGE -->
  <section class="page" id="pgAdd">
   <main>
    <h1>Add</h1>
    <form id="form">
      <div class="seg" id="types" role="group" aria-label="Type"></div>
      <div id="typeName"></div>

      <label class="amount">Amount<input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></label>

      <div class="row">
        <label>Date<input id="date" type="date" required></label>
        <label>Category<select id="cata"></select></label>
      </div>

      <div class="row">
        <label>From<select id="from"></select></label>
        <label>To<select id="to"></select></label>
      </div>

      <label>Remarks<textarea id="remarks" rows="2" placeholder="Add a note"></textarea></label>

      <label class="check">Plan<input id="plan" type="checkbox"></label>

      <button class="save" id="saveBtn" type="submit">Save transaction</button>
      <div id="msg" role="status"></div>
    </form>
   </main>
  </section>

  <!-- DASHBOARD PAGE -->
  <section class="page" id="pgDash">
   <main>
    <h1>Dashboard</h1>

    <div class="seg sq" id="modeSeg">
      <i class="thumb"></i>
      <button type="button">Real</button>
      <button type="button">Plan</button>
      <button type="button">Real+Plan</button>
    </div>

    <div class="card bal">
      <div class="lbl" id="balLbl">Balance</div>
      <div class="big" id="balance">0</div>
      <div class="split">
        <div>Bank<b id="bBank">0</b></div>
        <div>Cash<b id="bCash">0</b></div>
      </div>
    </div>

    <div class="three">
      <div class="card">In<b class="inc" id="cIn">0</b></div>
      <div class="card">Out<b class="exp" id="cOut">0</b></div>
      <div class="card">Net<b id="cNet">0</b></div>
    </div>

    <div class="card">
      <div class="chead">
        <div class="t" id="calNav">
          <button class="ib" id="prevM" type="button" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <span id="calTitle"></span>
          <button class="ib" id="nextM" type="button" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <div class="vsw">
          <button class="ib on" id="vCal" type="button" aria-label="Calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
          <button class="ib" id="vGraph" type="button" aria-label="Graph"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></button>
        </div>
      </div>
      <div id="calWrap">
        <div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
        <div id="calGrid"></div>
      </div>
      <div id="graphBox">Graph coming soon</div>
    </div>

    <div class="card">
      <div class="lh"><b>Transactions</b><span id="listRange"></span></div>
      <div id="recent"></div>
    </div>
   </main>
  </section>

 </div>
</div>

<nav class="nav" aria-label="Pages">
  <button type="button" data-p="0" aria-label="Add" aria-current="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button type="button" data-p="1" aria-label="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></button>
</nav>

<script src="config.js"></script>
<script>
if (typeof SUPABASE_URL === "undefined" || typeof SUPABASE_KEY === "undefined") {
  const m = document.getElementById("msg");
  m.textContent = "config.js not found. Upload config.js next to index.html.";
  m.style.color = "var(--err)";
  throw new Error("config.js missing");
}

let BASE = SUPABASE_URL.trim().replace(/\/+$/, "");
if (!BASE.includes("/rest/v1")) BASE += "/rest/v1";
BASE += "/";
const HEAD = { apikey: SUPABASE_KEY.trim(), "Content-Type": "application/json" };
async function getq(path) {
  try {
    const r = await fetch(BASE + path, { headers: HEAD });
    const j = await r.json();
    if (!r.ok) return { error: { message: j.message || "HTTP " + r.status } };
    return { data: j };
  } catch (e) { return { error: { message: e.message } }; }
}
const get = table => getq(table + "?select=*&order=id");
async function fetchAll() {
  let out = [], off = 0;
  for (;;) {
    const r = await getq(`transaction?select=*&order=date.desc,id.desc&limit=1000&offset=${off}`);
    if (r.error) return r;
    out = out.concat(r.data);
    if (r.data.length < 1000) break;
    off += 1000;
  }
  return { data: out };
}
async function add(row) {
  try {
    const r = await fetch(BASE + "transaction", { method: "POST", headers: { ...HEAD, Prefer: "return=minimal" }, body: JSON.stringify(row) });
    if (!r.ok) { const j = await r.json(); return { error: { message: j.message || "HTTP " + r.status } }; }
    return {};
  } catch (e) { return { error: { message: e.message } }; }
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const money = n => Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const iso = (y, m, d) => new Date(Date.UTC(y, m, d)).toISOString().slice(0,10);
const say = (t, ok) => { $("msg").textContent = t; $("msg").style.color = ok ? "var(--ok)" : "var(--err)"; };

// ---------- Sliding segmented control ----------
function makeSeg(el, onPick) {
  const th = el.querySelector(".thumb"), bs = [...el.querySelectorAll("button")], n = bs.length;
  el.style.setProperty("--n", n);
  let idx = 0, down = false, drag = false, sx = 0;
  const mark = () => bs.forEach((b, j) => b.setAttribute("aria-pressed", String(j === idx)));
  const at = x => { const r = el.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.floor((x - r.left - 4) / ((r.width - 8) / n)))); };
  const snap = () => { th.style.transition = ""; th.style.transform = `translateX(${idx * 100}%)`; };
  const set = i => { idx = i; mark(); if (!drag) snap(); };
  el.addEventListener("pointerdown", e => { down = true; drag = false; sx = e.clientX; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => {
    if (!down) return;
    if (!drag && Math.abs(e.clientX - sx) > 6) { drag = true; th.style.transition = "none"; }
    if (!drag) return;
    const r = el.getBoundingClientRect(), W = r.width - 8, tw = W / n;
    const x = Math.max(0, Math.min(W - tw, e.clientX - r.left - 4 - tw / 2));
    th.style.transform = `translateX(${x}px)`;
    const i = at(e.clientX);
    if (i !== idx) { idx = i; mark(); onPick(i); }
  });
  const end = e => {
    if (!down) return;
    down = false;
    if (!drag) { const i = at(e.clientX); idx = i; mark(); onPick(i); }
    drag = false; snap();
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  bs.forEach((b, j) => b.addEventListener("click", e => { if (e.detail === 0) { idx = j; mark(); snap(); onPick(j); } }));
  set(0);
  return { set };
}

// ---------- Pages ----------
let page = 0, typeColor = "#e5484d";
function applyAccent() {
  document.documentElement.style.setProperty("--accent", page === 0 ? typeColor : "#6366f1");
}
function go(p) {
  page = p;
  $("track").style.transform = `translateX(${-p * 50}%)`;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", String(Number(b.dataset.p) === p)));
  applyAccent();
}
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(Number(b.dataset.p)));

let px = null, py = null;
$("pages").addEventListener("pointerdown", e => {
  if (e.target.closest(".seg,#calWrap,input,select,textarea")) { px = null; return; }
  px = e.clientX; py = e.clientY;
});
$("pages").addEventListener("pointerup", e => {
  if (px === null) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  px = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  go(dx < 0 ? 1 : 0);
});

// ---------- Form ----------
let typeId = null, typeSeg = null;
const ICONS = {
  "income":'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  "expense":'<path d="M12 20V9M7 13l5-5 5 5M5 4h14"/>',
  "transfer":'<path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/>',
  "other income":'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>'
};
function fillSelect(el, rows, key, blank) {
  el.innerHTML = `<option value="">${blank}</option>` +
    rows.map(r => `<option value="${r.id}">${esc(r[key])}</option>`).join("");
}
let TYPES = [], CATS = [], ACCS = [];
function bankId() {
  const o = [...$("from").options].find(o => o.text.trim().toLowerCase() === "bank");
  return o ? o.value : "";
}
function pickType(id) {
  typeId = id;
  const i = TYPES.findIndex(r => r.id === id);
  if (typeSeg) typeSeg.set(i);
  const name = (TYPES[i] || {})["type name"] || "";
  $("typeName").textContent = name;
  const COL = { "expense":"#e5484d", "income":"#12a36b", "other income":"#0ea5a4", "transfer":"#3b82f6" };
  typeColor = COL[name.toLowerCase()] || "#6366f1";
  applyAccent();
  const k = name.toLowerCase(), b = bankId();
  if (k === "expense") { $("from").value = ""; $("to").value = b; }
  else if (k === "income" || k === "other income") { $("from").value = b; $("to").value = ""; }
  else if (k === "transfer") { $("from").value = b; $("to").value = b; }
}
async function loadLists() {
  const [t, a, c] = await Promise.all([get("type"), get("accounts"), get("cata")]);
  if (t.error || a.error || c.error) { say("Error: " + (t.error || a.error || c.error).message, false); return false; }
  TYPES = t.data; ACCS = a.data; CATS = c.data;
  $("types").innerHTML = '<i class="thumb"></i>' + t.data.map(r => {
    const name = r["type name"];
    const icon = ICONS[name.toLowerCase()] || '<circle cx="12" cy="12" r="3"/>';
    return `<button type="button" data-id="${r.id}" aria-pressed="false" aria-label="${esc(name)}" title="${esc(name)}"><svg viewBox="0 0 24 24">${icon}</svg></button>`;
  }).join("");
  typeSeg = makeSeg($("types"), i => pickType(TYPES[i].id));
  fillSelect($("from"), a.data, "account name", "From");
  fillSelect($("to"), a.data, "account name", "To");
  fillSelect($("cata"), c.data, "cata name", "Category");
  const d = t.data.find(r => r["type name"].toLowerCase() === "expense") || t.data[0];
  if (d) pickType(d.id);
  return true;
}

$("form").onsubmit = async e => {
  e.preventDefault();
  if (!typeId) { say("Choose a type.", false); return; }
  $("saveBtn").disabled = true;
  const row = {
    date: $("date").value,
    amount: Number($("amount").value),
    cata: $("cata").value || null,
    type: typeId,
    remarks: $("remarks").value.trim() || null,
    from: $("from").value || null,
    to: $("to").value || null,
    plan: $("plan").checked
  };
  const { error } = await add(row);
  $("saveBtn").disabled = false;
  if (error) { say(error.message, false); return; }
  say("Saved", true);
  $("amount").value = ""; $("remarks").value = ""; $("plan").checked = false; updatePlan();
  $("amount").focus();
  loadAll();
};
function updatePlan() {
  const on = $("plan").checked;
  $("form").classList.toggle("is-plan", on);
  $("saveBtn").textContent = on ? "Save as plan" : "Save transaction";
}
$("plan").onchange = updatePlan;

// ---------- Dashboard data ----------
let ALL = [], ERR = "", mode = 0, sel = null, calView = "cal";
const now0 = new Date();
let dY = now0.getFullYear(), dM = now0.getMonth();

const nameOf = (list, key, id) => (list.find(r => r.id === id) || {})[key] || "";
const kind = id => nameOf(TYPES, "type name", id).toLowerCase();
const accKey = id => { const n = nameOf(ACCS, "account name", id).trim().toLowerCase(); return n === "bank" || n === "cash" ? n : null; };

// Per-transaction effect on Bank / Cash. Income uses From, Expense uses To (your form defaults).
function effect(t) {
  const k = kind(t.type), a = Number(t.amount) || 0, e = { bank: 0, cash: 0, inn: 0, out: 0 };
  if (k === "income" || k === "other income") {
    const x = accKey(t.from) || accKey(t.to);
    if (x) { e[x] += a; e.inn = a; }
  } else if (k === "expense") {
    const x = accKey(t.to) || accKey(t.from);
    if (x) { e[x] -= a; e.out = a; }
  } else if (k === "transfer") {
    const f = accKey(t.from), d = accKey(t.to);
    if (f) e[f] -= a;
    if (d) e[d] += a;
  }
  return e;
}

async function loadAll() {
  const r = await fetchAll();
  if (r.error) { ERR = r.error.message; ALL = []; }
  else { ERR = ""; ALL = r.data; ALL.forEach(t => t._e = effect(t)); }
  renderDash();
}

const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
function short(n) {
  const a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 100000) return s + (a / 100000).toFixed(1).replace(/\.0$/, "") + "L";
  if (a >= 1000) return s + (a / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return s + Math.round(a);
}
function colorize(el, n) { el.classList.toggle("exp", n < 0); el.classList.toggle("inc", n >= 0); }

function setSel(a, b) {
  if (a === null) sel = null;
  else sel = a <= b ? { a, b } : { a: b, b: a };
  renderDash();
}

function renderDash() {
  const rows = ALL.filter(t => mode === 2 || (mode === 1) === !!t.plan);
  const ms = iso(dY, dM, 1), me = iso(dY, dM + 1, 0);
  const lo = sel ? sel.a : ms, hi = sel ? sel.b : me;
  let bank = 0, cash = 0, inn = 0, out = 0;
  const net = {}, has = {}, list = [];
  for (const t of rows) {
    const e = t._e, d = t.date;
    if (d <= hi) { bank += e.bank; cash += e.cash; }
    if (d >= ms && d <= me) { net[d] = (net[d] || 0) + e.inn - e.out; has[d] = 1; }
    if (d >= lo && d <= hi) { inn += e.inn; out += e.out; list.push(t); }
  }

  // balance + cards
  const bal = bank + cash;
  $("balLbl").textContent = "Balance · " + fmt(hi);
  $("balance").textContent = money(bal);
  $("balance").className = "big " + (bal < 0 ? "exp" : "");
  $("bBank").textContent = money(bank);
  $("bCash").textContent = money(cash);
  $("cIn").textContent = money(inn);
  $("cOut").textContent = money(out);
  $("cNet").textContent = money(inn - out);
  colorize($("cNet"), inn - out);

  // calendar
  $("calTitle").textContent = new Date(Date.UTC(dY, dM, 1)).toLocaleString("en-IN", { month: "long", year: "numeric", timeZone: "UTC" });
  const lead = new Date(Date.UTC(dY, dM, 1)).getUTCDay();
  const days = new Date(Date.UTC(dY, dM + 1, 0)).getUTCDate();
  const td = today();
  let h = "<span></span>".repeat(lead);
  for (let d = 1; d <= days; d++) {
    const ds = iso(dY, dM, d), v = net[ds] || 0;
    const c = ["day"];
    if (ds === td) c.push("today");
    if (sel && ds >= sel.a && ds <= sel.b) c.push(ds === sel.a || ds === sel.b ? "edge" : "in");
    h += `<div class="${c.join(" ")}" data-d="${ds}">${d}<small class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${has[ds] ? short(v) : ""}</small></div>`;
  }
  $("calGrid").innerHTML = h;

  // list
  $("listRange").textContent = sel ? (sel.a === sel.b ? fmt(sel.a) : fmt(sel.a) + " – " + fmt(sel.b)) : $("calTitle").textContent;
  if (ERR) { $("recent").innerHTML = `<div class="empty">${esc(ERR)}</div>`; return; }
  if (!ALL.length) { $("recent").innerHTML = `<div class="empty">No data. If you have transactions, enable SELECT for anon on the transaction table.</div>`; return; }
  if (!list.length) { $("recent").innerHTML = `<div class="empty">No transactions</div>`; return; }
  $("recent").innerHTML = list.slice(0, 200).map(t => {
    const k = kind(t.type);
    const cls = k === "expense" ? "exp" : k === "transfer" ? "trf" : "inc";
    const sign = k === "expense" ? "-" : k === "transfer" ? "" : "+";
    const cat = nameOf(CATS, "cata name", t.cata) || nameOf(TYPES, "type name", t.type);
    const acc = [nameOf(ACCS, "account name", t.from), nameOf(ACCS, "account name", t.to)].filter(Boolean).join(" → ");
    const sub = [fmt(t.date), acc, t.remarks].filter(Boolean).join(" · ");
    return `<div class="item"><div class="l"><div class="t">${esc(cat)}${t.plan ? '<span class="tag">PLAN</span>' : ""}</div><div class="s">${esc(sub)}</div></div><div class="a ${cls}">${sign}${money(t.amount)}</div></div>`;
  }).join("");
}

// mode tabs
makeSeg($("modeSeg"), i => { mode = i; renderDash(); });

// month nav
function shiftMonth(d) {
  dM += d;
  if (dM < 0) { dM = 11; dY--; }
  if (dM > 11) { dM = 0; dY++; }
  sel = null;
  renderDash();
}
$("prevM").onclick = () => shiftMonth(-1);
$("nextM").onclick = () => shiftMonth(1);

// calendar / graph switch
function setView(v) {
  calView = v;
  $("vCal").classList.toggle("on", v === "cal");
  $("vGraph").classList.toggle("on", v === "graph");
  $("calWrap").style.display = v === "cal" ? "" : "none";
  $("graphBox").style.display = v === "graph" ? "block" : "none";
  $("calNav").style.visibility = v === "cal" ? "visible" : "hidden";
}
$("vCal").onclick = () => setView("cal");
$("vGraph").onclick = () => setView("graph");

// calendar tap + drag select
let dragA = null, moved = false, lastKey = "";
const cw = $("calWrap");
cw.addEventListener("pointerdown", e => {
  const c = e.target.closest("[data-d]");
  if (!c) return;
  dragA = c.dataset.d; moved = false; lastKey = "";
  cw.setPointerCapture(e.pointerId);
});
cw.addEventListener("pointermove", e => {
  if (!dragA) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const c = el && el.closest("[data-d]");
  if (!c) return;
  if (c.dataset.d !== dragA || moved) {
    moved = true;
    const key = dragA + c.dataset.d;
    if (key !== lastKey) { lastKey = key; setSel(dragA, c.dataset.d); }
  }
});
cw.addEventListener("pointerup", () => {
  if (!dragA) return;
  if (!moved) {
    if (sel && sel.a === sel.b && sel.a === dragA) setSel(null);
    else setSel(dragA, dragA);
  }
  dragA = null;
});
cw.addEventListener("pointercancel", () => { dragA = null; });

// ---------- Start ----------
async function showApp() {
  $("date").value = today();
  if (await loadLists()) await loadAll();
}
renderDash();
showApp();
</script>
</body>
</html>
